<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="1" stop-color="#120a2a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a78bfa;#f472b6;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#f472b6;#22d3ee;#a78bfa" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#22d3ee;#a78bfa;#f472b6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#a78bfa" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="blobA"><stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobB"><stop offset="0" stop-color="#06b6d4" stop-opacity=".45"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobC"><stop offset="0" stop-color="#ec4899" stop-opacity=".35"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
    .code{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .fade1{opacity:0;animation:in .9s ease-out .2s forwards}
    .fade2{opacity:0;animation:in .9s ease-out .7s forwards}
    .fade3{opacity:0;animation:in .9s ease-out 1.2s forwards}
    .fade4{opacity:0;animation:in .9s ease-out 1.7s forwards}
    @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    .p2{animation-delay:.6s}.p3{animation-delay:1.2s}.p4{animation-delay:1.8s}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle r="260" fill="url(#blobA)" cx="200" cy="80">
      <animate attributeName="cx" values="200;320;200" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;150;80" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle r="240" fill="url(#blobB)" cx="1000" cy="60">
      <animate attributeName="cx" values="1000;880;1000" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;140;60" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle r="220" fill="url(#blobC)" cx="640" cy="300">
      <animate attributeName="cx" values="640;520;760;640" dur="18s" repeatCount="indefinite"/>
    </circle>

    <!-- agent network -->
    <g stroke="#a78bfa" stroke-opacity=".35" stroke-width="1.4" fill="none">
      <path d="M960 70 L1040 110 L1120 70 M1040 110 L1070 190 L1140 220 M1070 190 L990 210"/>
    </g>
    <g fill="#c4b5fd">
      <circle class="pulse" cx="960" cy="70" r="4"/>
      <circle class="pulse p2" cx="1040" cy="110" r="6"/>
      <circle class="pulse p3" cx="1120" cy="70" r="4"/>
      <circle class="pulse p4" cx="1070" cy="190" r="6"/>
      <circle class="pulse p2" cx="1140" cy="220" r="4"/>
      <circle class="pulse p3" cx="990" cy="210" r="4"/>
    </g>
    <circle r="3.5" fill="#22d3ee" filter="url(#glow)">
      <animateMotion dur="5s" repeatCount="indefinite" path="M960 70 L1040 110 L1070 190 L1140 220"/>
    </circle>
    <circle r="3.5" fill="#f472b6" filter="url(#glow)">
      <animateMotion dur="6s" repeatCount="indefinite" path="M1120 70 L1040 110 L1070 190 L990 210"/>
    </circle>

    <!-- text -->
    <g class="t">
      <text class="code fade1" x="70" y="88" font-size="20" fill="#67e8f9">&lt;<tspan fill="#c4b5fd">Agent</tspan> plan → code → test → PR /&gt;</text>
      <g class="fade2">
        <text x="66" y="168" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#title)" filter="url(#glow)" opacity=".35">Ben Gedi</text>
        <text x="66" y="168" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#title)">Ben Gedi</text>
      </g>
      <text class="fade3" x="70" y="214" font-size="28" font-weight="600" fill="#e2e8f0">Senior Frontend Engineer <tspan fill="#64748b">·</tspan> AI-Native Engineering</text>
      <text class="code fade4" x="70" y="252" font-size="18" fill="#94a3b8">Claude Code · AI Agents · MCP · React · TypeScript · Design Systems<tspan class="caret" fill="#22d3ee"> ▍</tspan></text>
    </g>

    <!-- waves -->
    <path fill="url(#wave2)" opacity=".8">
      <animate attributeName="d" dur="9s" repeatCount="indefinite"
        values="M0 296 C200 276 400 312 600 294 C800 276 1000 312 1200 292 V320 H0Z;
                M0 290 C200 312 400 278 600 298 C800 316 1000 280 1200 300 V320 H0Z;
                M0 296 C200 276 400 312 600 294 C800 276 1000 312 1200 292 V320 H0Z"/>
    </path>
    <path fill="url(#wave1)">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="M0 306 C150 296 350 318 600 304 C850 290 1050 318 1200 304 V320 H0Z;
                M0 302 C150 316 350 294 600 310 C850 320 1050 294 1200 308 V320 H0Z;
                M0 306 C150 296 350 318 600 304 C850 290 1050 318 1200 304 V320 H0Z"/>
    </path>
  </g>
</svg>
